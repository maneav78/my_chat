name: CI

on: [push, pull_request]

jobs:
  images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Commit Short SHA
        run: echo "COMMIT_SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and Push Docker Front Image With Commit SHA
        uses: docker/build-push-action@v5
        with:
          context: ./vue-project
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-front:${{ env.COMMIT_SHORT_SHA }}

      - name: Build and Push Docker Front Image
        uses: docker/build-push-action@v5
        with:
          context: ./vue-project
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-front:latest

      - name: Build and Push Docker Back Image With Commit SHA
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-back:${{ env.COMMIT_SHORT_SHA }}

      - name: Build and Push Docker Back Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-back:latest

      - name: Build and Push Docker Test Image With Commit SHA
        uses: docker/build-push-action@v5
        with:
          context: ./testing
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-test:${{ env.COMMIT_SHORT_SHA }}

      - name: Build and Push Docker Test Image
        uses: docker/build-push-action@v5
        with:
          context: ./testing
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-test:latest

  compose_checking:
    name: Check Docker Compose
    runs-on: ubuntu-latest
    needs: images

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Set environment variables
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
        echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> $GITHUB_ENV

    - name: Print Environment Variables
      run: printenv

    - name: Ensure Network Creation
      run: docker network create chat-network || true

    - name: Docker Compose Up
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
      run: docker-compose up -d --build

    - name: Check if Back Container is Running
      run: docker ps | grep chat-main-dc || echo "Back container is not running"

    - name: Check if Front Container is Running
      run: docker ps | grep chat-vue-dc || echo "Front container is not running"

    - name: Docker logging - Back Container
      run: docker logs chat-main-dc

    - name: Docker logging - Front Container
      run: docker logs chat-vue-dc

    - name: Inspect Docker Network
      run: docker network inspect chat-network

    - name: Check Back Container Health
      run: |
        sleep 10  
        curl -v http://localhost:5000

    - name: Docker logging - Back Container
      run: docker logs test-script-dc

    



