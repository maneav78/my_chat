name: CI

on: [push, pull_request]

jobs:
  images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Commit Short SHA
        run: echo "COMMIT_SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and Push Docker Front Image With Commit SHA
        uses: docker/build-push-action@v5
        with:
          context: ./vue-project
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-front:${{ env.COMMIT_SHORT_SHA }}

      - name: Build and Push Docker Front Image
        uses: docker/build-push-action@v5
        with:
          context: ./vue-project
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-front:latest

      - name: Build and Push Docker Back Image With Commit SHA
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-back:${{ env.COMMIT_SHORT_SHA }}

      - name: Build and Push Docker Back Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-back:latest

  compose_checking:
    name: Check Docker Compose
    runs-on: ubuntu-latest
    needs: images

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: Pull Front Image
      #   run: docker pull ${{ secrets.DOCKER_USERNAME }}/chat-front:latest

      # - name: Pull Back Image
      #   run: docker pull ${{ secrets.DOCKER_USERNAME }}/chat-back:latest

      - name: Set environment variables
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> $GITHUB_ENV

      - name: Print Environment Variables
        run: printenv

      - name: Running docker-compose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: docker-compose up -d --build  

      - name: Print Docker Compose logs
        run: docker-compose logs

      - name: Docker Compose down
        run: docker-compose down

  test_send_chat_message:
    name: Test Send Chat Message
    runs-on: ubuntu-latest
    needs: compose_checking

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install build-essential and gcc
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc && sudo rm -rf /var/lib/apt/lists/*
      
      - name: Install requests library
        run: python -m pip install requests

      # - name: Pull Front Image
      #   run: docker pull ${{ secrets.DOCKER_USERNAME }}/chat-front:latest

      # - name: Pull Back Image
      #   run: docker pull ${{ secrets.DOCKER_USERNAME }}/chat-back:latest

      - name: Set environment variables
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> $GITHUB_ENV

      - name: Print Environment Variables
        run: printenv

      - name: Running docker-compose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: docker-compose up -d --build

      - name: Waiting
        run: sleep 180 
      
      - name: Print Flask container logs
        run: docker logs chat-main-dc

      - name: Print Docker Compose logs
        run: docker-compose logs  

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Run script to send chat message
        run: python test.py

      - name: Print Docker Compose logs
        run: docker-compose logs  

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: test_send_chat_message

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Downloading Kind
        run: | 
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
            
      - name: Set up Kubernetes
        uses: azure/setup-kubectl@v3

      - name: Creating cluster
        run: |
          kind create cluster --name my-chat-cluster
          kubectl cluster-info --context kind-my-chat-cluster

      - name: Applying yaml file
        run: |
          sed -i 's|MONGO_URI_PLACEHOLDER|'"${{ secrets.MONGODB_URI }}"'|g' ./k8s/deployment.yaml
          sed -i 's|API_KEY_PLACEHOLDER|'"${{ secrets.OPENAI_API_KEY }}"'|g' ./k8s/deployment.yaml
          kubectl apply -f ./k8s/deployment.yaml
